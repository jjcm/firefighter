name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: make test-install
      - run: make linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: dist/
