# Install as /etc/nginx/sites-available/firefighter and enable its symlink.
# Provision the firefighter-ip certificate before enabling the HTTPS server.
server {
    listen 80;
    listen [::]:80;
    server_name 45.76.243.18;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://45.76.243.18$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 45.76.243.18;

    ssl_certificate /etc/letsencrypt/live/firefighter-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/firefighter-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FirefighterTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    client_max_body_size 1m;

    # This directory contains public release binaries and checksums only.
    # Downloads bypass the hub's deliberately narrow website-file allowlist.
    location /downloads/ {
        alias /opt/firefighter/downloads/;
        default_type application/octet-stream;
        autoindex off;
        limit_except GET { deny all; }
    }

    location ~ /\. {
        deny all;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, never append, a client-supplied address. The hub trusts
        # X-Real-IP only because its HTTP listener is restricted to loopback.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
    }
}
